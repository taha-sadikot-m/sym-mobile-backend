# Local development database: the web backend's table structure (no data) plus the mobile schema.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: owner_local
      POSTGRES_DB: sym
    ports:
      - "5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/db:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d sym"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
